<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    padding: 30px 15px;
}

.player {
    max-width: 900px;
    margin: auto;
    background: #1e293b;
    padding: 25px;
    border-radius: 18px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 30px;
}

.album {
    text-align: center;
}

.cover {
    background: linear-gradient(135deg, #0ea5e9, #312e81);
    height: 200px;
    width: 200px;
    margin: auto;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}
